<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUVIA | Kembara Suku Kata KV</title><style>
:root{font-family:system-ui,'Arial',sans-serif;color:#102b62}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#49c9ef,#053f92 75%);min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px max(12px,3vw);color:white}.top strong{font-size:clamp(14px,2vw,22px)}.tools{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;font:inherit} .tools button,.pill{background:#fff;color:#183c83;border:2px solid #9edcff;border-radius:20px;padding:9px 13px;font-weight:750}.frame{position:relative;width:var(--slide-size,1150px);aspect-ratio:1037/584;margin:0 auto 12px;box-shadow:0 16px 45px #001f5a88;border:3px solid #b6faff;border-radius:16px;overflow:hidden;background:#078dc9}.frame img{display:block;width:100%;height:100%;object-fit:contain}.hot{position:absolute;z-index:2;background:transparent;border:2px solid transparent;border-radius:16px;color:transparent;overflow:hidden}.hot:hover,.hot:focus-visible{border:3px dashed #fff;background:#ffef0040;outline:2px solid #123cff;outline-offset:-4px}.hot:active{background:#fff5}.hot:focus-visible::after{content:attr(aria-label);position:absolute;inset:0;display:grid;place-items:center;color:#061f57;background:#ffffffe8;font-size:clamp(10px,1.4vw,18px);font-weight:bold}.bottom{max-width:1150px;margin:auto;padding:4px 16px 24px;color:white;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.bottom button{border:0;background:#ffdb48;border-radius:12px;padding:10px 16px;font-weight:bold;color:#172d65}.overlay{position:fixed;z-index:100;inset:0;background:#001e57c9;display:grid;place-items:center;padding:15px}.panel{background:white;border:5px solid #86d9ff;border-radius:22px;padding:clamp(12px,2vw,26px);width:min(96%,860px);max-height:92vh;overflow:auto;box-shadow:0 10px 30px #0007}.panel h2{margin:0 0 10px}.panel button{border:0;border-radius:12px;background:#1564db;color:white;padding:10px 15px;margin:4px;font-weight:700}.panel input,.panel textarea,.panel select{font:inherit;border:1px solid #8da9d0;border-radius:8px;padding:6px;max-width:100%}.panel table{width:100%;border-collapse:collapse;font-size:clamp(11px,1.5vw,15px)}.panel th,.panel td{border:1px solid #aac8e6;padding:5px;text-align:center}.panel td:first-child{text-align:left}.panel label{display:inline-flex;align-items:center;gap:4px}.hint{font-size:13px;color:#425b7a}.video{width:100%;aspect-ratio:16/9;border:0;background:#112d56}.status{color:#fff;background:#072f78;padding:6px 12px;border-radius:15px;font-size:13px} @media(max-width:650px){.top{align-items:flex-start}.tools button{padding:6px 8px;font-size:12px}.frame{border-radius:12px;border-width:2px}.bottom{font-size:12px}.panel{width:98%;padding:10px;border-width:2px}.panel button{padding:8px}}
 .viewer{width:100%;overflow:auto;padding:12px 16px 24px;overscroll-behavior-x:contain}.frame{max-width:none;flex-shrink:0}.top{position:sticky;top:0;z-index:10;background:#063d8fe8;backdrop-filter:blur(8px)}.zoom-controls{display:flex;gap:7px;align-items:center}.zoom-controls button{background:#fff;color:#183c83;border:2px solid #9edcff;border-radius:12px;padding:7px 11px;font-weight:bold}.zoom-controls span{font-weight:bold;color:white;min-width:54px;text-align:center}.bottom{max-width:1150px} @media(max-width:700px){.viewer{padding:6px 4px 20px}.top{flex-wrap:wrap}.zoom-controls{width:100%;justify-content:center}}  .edit-mode .hot{border:2px solid #ff2878!important;background:#ff28782b!important;color:#101a4e!important;cursor:move;touch-action:none;overflow:visible}
 .edit-mode .hot::before{content:attr(aria-label);position:absolute;left:0;top:0;font-size:11px;white-space:nowrap;background:#fffbe9;padding:2px 4px;border-radius:4px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
 .edit-mode .hot::after{content:"↘";position:absolute;right:0;bottom:0;background:#ff2878;color:white;font-size:17px;width:22px;height:22px;text-align:center;border-radius:5px;cursor:nwse-resize}
 #editHint{color:#fff;background:#9b205c;padding:9px 14px;margin:4px 16px;border-radius:10px;font-size:14px}
 .debug-hotspots .hot{border:2px solid #ff2a78!important;background:#ff2a7830!important}  .music-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.music-tools button{background:#e5fbff;color:#063d8f;border:2px solid #9edcff;border-radius:14px;padding:8px 11px;font-weight:700}.music-tools label{display:flex;align-items:center;gap:5px;color:white;font-size:12px}.music-tools input{width:80px;accent-color:#7be9ff} </style></head><body><header class="top"><strong>🐢 KUVIA · Kembara Suku Kata KV</strong><div class="tools"><button onclick="go(1)">⌂ Halaman Utama</button><button onclick="go(7)">🗺 Peta</button><button onclick="historyBack()">↶ Kembali</button><button onclick="showHelp()">? Bantuan</button><button id="editBtn" onclick="toggleEdit()">✥ Laras butang</button></div><div class="music-tools"><button id="musicToggle" onclick="toggleMusic()" aria-pressed="false" title="Hidupkan atau matikan muzik latar">♫ Main muzik</button><label for="musicVolume">Vol <input id="musicVolume" type="range" min="0" max="50" value="25" oninput="setMusicVolume(this.value)" aria-label="Kelantangan muzik latar"></label></div><div class="zoom-controls"><button onclick="changeZoom(-100)" aria-label="Kecilkan grafik">−</button><span id="zoomValue">115%</span><button onclick="changeZoom(100)" aria-label="Besarkan grafik">+</button><button onclick="resetZoom()">Saiz asal</button></div></header><main><div id="editHint" hidden>Mod pelarasan: seret kotak merah jambu ke atas butang pada grafik. Seret penjuru kanan bawah ↘ untuk ubah saiz. Kedudukan disimpan automatik dalam pelayar ini. <button onclick="resetCoords()">Set semula halaman</button> <button onclick="exportCoords()">Eksport kedudukan</button></div><div class="viewer" id="viewer"><div class="frame" id="frame"><img id="slide" alt="Paparan pembelajaran KUVIA"><div id="hotspots"></div></div></div><div id="modalRoot"></div><audio id="kuviaMusic" src="muzik_latar_kuvia.wav" loop preload="auto"></audio><div class="bottom"><span class="status" id="pageStatus"></span><div><button onclick="historyBack()">← Sebelumnya</button> <button onclick="nextPage()">Seterusnya →</button></div></div></main><script>let slideSize=Number(localStorage.getItem('kuviaSlideSize'))||1150;function setZoom(){document.documentElement.style.setProperty('--slide-size',slideSize+'px');document.getElementById('zoomValue').textContent=Math.round(slideSize/10)+'%';localStorage.setItem('kuviaSlideSize',slideSize)}function changeZoom(n){slideSize=Math.max(600,Math.min(2000,slideSize+n));setZoom()}function resetZoom(){slideSize=1150;setZoom()}setZoom();</script><script src="app.js"></script></body></html>
